{% extends "base.html" %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account 🥩
                </h2>


                <form method="POST">

                    {% csrf_token %}


                    {{ form.as_p }}


                    <button 
                    type="submit"
                    class="btn btn-success w-100">

                        Register

                    </button>


                </form>


                <p class="text-center mt-3">

                    Already have account?

                    <a href="#">
                        Login
                    </a>

                </p>


            </div>

        </div>

    </div>

</div>


{% endblock %}
