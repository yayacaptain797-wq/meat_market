{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<div class="row">

<div class="col-md-6">

<img src="{{ product.image.url }}"
class="img-fluid rounded shadow">

</div>


<div class="col-md-6">

<h1>
{{ product.name }}
</h1>

<h3>
₦{{ product.price }}
</h3>

<p>
{{ product.description }}
</p>


<a href="{% url 'add_to_cart' product.id %}"
class="btn btn-success">

🛒 Add To Cart

</a>


</div>

</div>

</div>

{% endblock %}
